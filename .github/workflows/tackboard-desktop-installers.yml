name: TackBoard desktop installers
on:
  workflow_dispatch:
  push:
    tags:
      - 'tackboard-desktop-v*'
permissions:
  contents: read
jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            task: dist:win
          - name: macos
            runner: macos-latest
            task: dist:mac
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate desktop sources
        shell: bash
        run: |
          if [ -d "archeon-nextjs/desktop/tackboard" ]; then
            echo "DESKTOP_DIR=archeon-nextjs/desktop/tackboard" >> "$GITHUB_ENV"
          elif [ -d "desktop/tackboard" ]; then
            echo "DESKTOP_DIR=desktop/tackboard" >> "$GITHUB_ENV"
          else
            echo "Desktop app folder not found" >&2; exit 1
          fi
      - name: Install desktop dependencies
        shell: bash
        run: cd "$DESKTOP_DIR" && npm install --no-audit --no-fund
      - name: Test desktop app
        shell: bash
        run: cd "$DESKTOP_DIR" && npm test
      - name: Build installers
        shell: bash
        run: cd "$DESKTOP_DIR" && npm run ${{ matrix.task }}
        env:
          # Code signing/notarization is a separate release gate.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: tackboard-${{ matrix.name }}
          path: |
            desktop/tackboard/dist/*.exe
            desktop/tackboard/dist/*.dmg
            desktop/tackboard/dist/*.zip
            archeon-nextjs/desktop/tackboard/dist/*.exe
            archeon-nextjs/desktop/tackboard/dist/*.dmg
            archeon-nextjs/desktop/tackboard/dist/*.zip
          if-no-files-found: error
          retention-days: 30
  publish:
    if: startsWith(github.ref, 'refs/tags/tackboard-desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tackboard-*
          path: release-assets
          merge-multiple: true
      - name: Publish release downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mapfile -d '' FILES < <(find release-assets -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -print0)
          if [ "${#FILES[@]}" -lt 3 ]; then echo 'Expected Windows installer and both Mac DMGs'; exit 1; fi
          printf 'Publishing %s installers\n' "${#FILES[@]}"
          gh release create "${GITHUB_REF_NAME}" "${FILES[@]}" --repo "${GITHUB_REPOSITORY}" --title "TackBoard Desktop ${GITHUB_REF_NAME}" --notes 'Unsigned preview installers: verify on Windows and macOS before production distribution.' --prerelease
