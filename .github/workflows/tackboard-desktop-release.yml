name: TackBoard desktop (Windows + macOS unsigned)
on:
  workflow_dispatch:
  push:
    tags:
      - 'tackboard-v*'
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/tackboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: tackboard-windows-unsigned
          path: desktop/tackboard/dist/*.exe
          if-no-files-found: error
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    defaults:
      run:
        working-directory: desktop/tackboard
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npx electron-builder --mac dmg zip --${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: tackboard-macos-${{ matrix.arch }}-unsigned
          path: |
            desktop/tackboard/dist/*.dmg
            desktop/tackboard/dist/*.zip
          if-no-files-found: error
